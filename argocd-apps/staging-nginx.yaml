# argocd-apps/dev-nginx.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-nginx
  namespace: argocd
spec:
  project: staging-project
  source:
    repoURL: https://github.com/rchethan602/gitops-repo
    targetRevision: master
    path: apps/nginx/overlays/staging        # changed
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true