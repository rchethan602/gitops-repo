apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25.0      # pinned — never latest in prod
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi